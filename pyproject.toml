[project]
name = "marimo-proyect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo[recommended]>=0.25.2",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
]

[project.scripts]
marimo-proyect = "marimo_proyect:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.marimo.runtime]
output_max_bytes = 20_000_000

